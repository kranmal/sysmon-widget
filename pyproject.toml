[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmon-widget"
version = "0.1.0"
description = "Transparent desktop system monitor: CPU, RAM, GPU, temps, disks, network"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "PySide6>=6.5"]

[project.scripts]
sysmon = "sysmon.app:main"

[tool.setuptools.packages.find]
where = ["src"]
